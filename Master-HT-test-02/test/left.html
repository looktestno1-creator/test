<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hearing test</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../app.css">
<style>:root{--screen:#FAFAFA;--nav:#FAFAFA}</style>
<style>
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:40px;min-height:0}
.beep{width:320px;height:320px;max-width:88vw;max-height:88vw;border-radius:50%;border:1.5px solid #ED4D33;
 background:#fff;color:#ED4D33;font-family:inherit;font-size:16px;font-weight:500;line-height:1;cursor:pointer;
 display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
.beep.down{background:#ED4D33;color:#fff}
.count{flex:1;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:700;color:#ED4D33}
.track{height:4px;background:#C9CED2;flex:0 0 4px}
.fill{height:4px;background:#ED4D33;width:4%;transition:width .2s}
.top{padding:20px 24px 0;flex:0 0 auto}
.gate{position:absolute;inset:0;background:rgba(250,250,250,.94);display:flex;align-items:center;
 justify-content:center;z-index:5}
.gate[hidden]{display:none}
</style></head>
<body>
<main class="device">
<header class="nav"><div class="sys"><span class="time">9:41</span><span class="icons"><svg width="20" height="13" viewBox="0 0 20 13" aria-hidden="true"><rect x="0" y="9" width="3.5" height="4" rx="1"/><rect x="5.5" y="6.5" width="3.5" height="6.5" rx="1"/><rect x="11" y="3.5" width="3.5" height="9.5" rx="1"/><rect x="16.5" y="0" width="3.5" height="13" rx="1"/></svg><svg width="18" height="13" viewBox="0 0 18 13" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 4.2A12 12 0 0 1 17 4.2"/><path d="M4 7.4A7.6 7.6 0 0 1 14 7.4"/><path d="M6.8 10.5A3.4 3.4 0 0 1 11.2 10.5"/><circle cx="9" cy="12.4" r=".9" fill="#000" stroke="none"/></svg><svg width="28" height="13" viewBox="0 0 28 13" aria-hidden="true"><rect x=".5" y=".5" width="24" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><path d="M26 4.5v4a2 2 0 0 0 0-4z" fill-opacity=".4"/></svg></span><span class="island"></span></div><div class="titlerow"><h1 class="navtitle">Hearing test</h1></div></header><div class="content flush"><div class="track"><div class="fill" id="fill"></div></div><div class="top"><h2 class="h3 center">Left ear</h2><p class="p1 center mt4">Keep the button pressed while you hear the beep.</p></div><div class="stage" id="stage"><div class="count" id="count">3</div></div><div class="gate" id="gate" hidden><p class="p1">Tap anywhere to start</p></div></div>
</main>
<script>

var TONE_MS=1200;
var TRIALS=[{f:500,v:1},{f:500,v:.25},{f:1000,v:1},{f:1000,v:.25},
            {f:2000,v:1},{f:2000,v:.25},{f:4000,v:1},{f:4000,v:.25}];
var ctx=null;
function audio(){if(!ctx){var C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C;}
  if(ctx&&ctx.resume)ctx.resume().catch(function(){});return ctx;}
function beep(freq,vol){return new Promise(function(done){
  var c=audio();if(!c){setTimeout(done,TONE_MS);return;}
  var osc=c.createOscillator(),gain=c.createGain(),ended=false;
  function stop(){if(ended)return;ended=true;try{osc.stop()}catch(e){}
    try{osc.disconnect();gain.disconnect()}catch(e){}done();}
  osc.type='sine';osc.frequency.value=freq;
  gain.gain.value=.2*Math.max(0,Math.min(1,vol));
  osc.connect(gain);gain.connect(c.destination);osc.onended=stop;osc.start();
  setTimeout(stop,TONE_MS);});}
function scoreFromHeard(h){var out=[];for(var i=0;i<4;i++){
  out.push((h[2*i]?.5:0)+(h[2*i+1]?.5:0));}return out;}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)});}
function ensureAudio(){return new Promise(function(res){
  var c=audio();
  if(!c||c.state==='running')return res();
  var done=function(){res();};
  var p=c.resume?c.resume():null;
  if(p&&p.then)p.then(done,function(){});
  setTimeout(function(){
    if(c.state==='running')return done();
    var gate=document.getElementById('gate');
    if(gate)gate.hidden=false;
    var go=function(){
      document.removeEventListener('pointerdown',go);
      if(gate)gate.hidden=true;
      var q=c.resume?c.resume():null;
      if(q&&q.then)q.then(done,done);else done();};
    document.addEventListener('pointerdown',go);
  },120);});}

var EAR='left',NEXT='./complete.html';
var stage=document.getElementById('stage'),fill=document.getElementById('fill'),down=false,heard=false;
function showBeep(){
  stage.innerHTML='<button class="beep" id="beep">I hear the beep</button>';
  var b=document.getElementById('beep');
  b.addEventListener('pointerdown',function(e){e.preventDefault();down=true;b.classList.add('down');});
  window.addEventListener('pointerup',function(){down=false;b.classList.remove('down');});
}
async function run(){
  await ensureAudio();
  var el=document.getElementById('count');
  for(var n=3;n>0;n--){el.textContent=n;await wait(800);}
  showBeep();
  var results=[];
  for(var i=0;i<TRIALS.length;i++){
    fill.style.width=Math.max(4,100*i/TRIALS.length)+'%';
    await wait(1000+2000*Math.random());
    heard=false;
    var poll=setInterval(function(){if(down)heard=true;},50);
    await beep(TRIALS[i].f,TRIALS[i].v);
    clearInterval(poll);
    results.push(heard);
  }
  fill.style.width='100%';
  try{sessionStorage.setItem('ht.'+EAR,JSON.stringify(scoreFromHeard(results)));}catch(e){}
  if(EAR==='right'){
    try{sessionStorage.setItem('ht.date',new Date().toLocaleDateString('en-GB',
      {day:'2-digit',month:'2-digit',year:'numeric'}));}catch(e){}
  }
  location.href=NEXT;
}
run();

</script>
</body>
</html>
