<body>
<main class="device">
<header class="nav"><div class="sys"><span class="time">9:41</span><span class="icons"><svg width="20" height="13" viewBox="0 0 20 13" aria-hidden="true"><rect x="0" y="9" width="3.5" height="4" rx="1"/><rect x="5.5" y="6.5" width="3.5" height="6.5" rx="1"/><rect x="11" y="3.5" width="3.5" height="9.5" rx="1"/><rect x="16.5" y="0" width="3.5" height="13" rx="1"/></svg><svg width="18" height="13" viewBox="0 0 18 13" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 4.2A12 12 0 0 1 17 4.2"/><path d="M4 7.4A7.6 7.6 0 0 1 14 7.4"/><path d="M6.8 10.5A3.4 3.4 0 0 1 11.2 10.5"/><circle cx="9" cy="12.4" r=".9" fill="#000" stroke="none"/></svg><svg width="28" height="13" viewBox="0 0 28 13" aria-hidden="true"><rect x=".5" y=".5" width="24" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><path d="M26 4.5v4a2 2 0 0 0 0-4z" fill-opacity=".4"/></svg></span><span class="island"></span></div><div class="titlerow"><h1 class="navtitle">Setup</h1><a class="back" href="./microphone-access.html" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121C25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></a></div></header><div class="content"><h2 class="h2 center">Find a quiet place</h2><p class="p1 center mt12">For the most accurate results, take the hearing test in a quiet environment.</p><div class="meter"><div class="bars" id="bars"></div><div class="labels"><span id="lq">Quiet</span><span id="lo">OK</span><span id="ll">Loud</span></div></div></div><div class="bottom"><a class="btn" href="./device-setup.html">Next</a></div>
</main>
<script>

var BARS=60,wrap=document.getElementById('bars'),bars=[];
for(var i=0;i<BARS;i++){var b=document.createElement('i');wrap.appendChild(b);bars.push(b);}
var lvl=.25;
function paint(){
  var colour=lvl<.4?'#00A56D':lvl<.75?'#F5A623':'#ED4D33';
  var filled=Math.round(lvl*BARS);
  for(var i=0;i<BARS;i++)bars[i].style.background=i<filled?colour:'#C9CED2';
  document.getElementById('lq').style.color=lvl<.4?'#00A56D':'#9AA1A7';
  document.getElementById('lo').style.color=(lvl>=.4&&lvl<.75)?'#F5A623':'#9AA1A7';
  document.getElementById('ll').style.color=lvl>=.75?'#ED4D33':'#9AA1A7';
}
paint();
setInterval(function(){
  lvl=Math.min(.95,Math.max(.05,lvl+.18*(Math.random()-.52)));paint();
},350);

</script>
</body>
</html>
